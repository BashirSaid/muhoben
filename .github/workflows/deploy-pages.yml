# فحص المشروع ونشره على GitHub Pages عند كل دفع إلى الفرع الرئيسي.
# قبل أول تشغيل: Settings ← Pages ← Source: GitHub Actions
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/dreamy-fermi-ueyaac]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build
        env:
          # مثل "/muhoben" لموقع مشروع، أو فارغ لنطاق مخصص
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_TELEMETRY_DISABLED: "1"

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
